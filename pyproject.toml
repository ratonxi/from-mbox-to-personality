[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "from-mbox-to-personality"
version = "0.1.0"
description = "Local-first Gmail MBOX analyzer that builds a writing persona and non-clinical communication profile."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andres" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mbox-to-persona = "mbox_to_persona.cli:main"
from-mbox-to-personality = "mbox_to_persona.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
